<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>window.__NETLIFY__=true;</script>
    <title>MoonTV — 影视聚合播放器</title>
    <link rel="manifest" href="/tv-manifest">
    <link rel="stylesheet" href="/static/css/tv.css">
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header class="tv-header">
    <div class="header-inner">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="菜单">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a href="#/" class="logo" data-nav="home">
            <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
                <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2" opacity=".5"/>
                <circle cx="16" cy="16" r="7" fill="currentColor" opacity=".25"/>
                <circle cx="16" cy="16" r="3" fill="currentColor"/>
            </svg>
            <span id="site-name">MoonTV</span>
        </a>
        <div class="header-search">
            <input type="text" id="global-search-input" placeholder="搜索影视 / 演员 / 导演...">
            <button id="global-search-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="btn-fav" title="收藏">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <button class="icon-btn" id="btn-settings" title="设置">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </div>
</header>

<!-- ===== 主体 ===== -->
<div class="tv-body">
    <!-- 桌面侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">导航</div>
            <a href="#/" class="side-item active" data-nav="home">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                首页
            </a>
            <a href="#/calendar" class="side-item" data-nav="calendar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                番剧日历
            </a>
            <a href="#/favorites" class="side-item" data-nav="favorites">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                我的收藏
            </a>
            <a href="#/history" class="side-item" data-nav="history">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                继续观看
            </a>
        </div>
        <div class="sidebar-section" id="category-section">
            <div class="sidebar-title">分类</div>
            <div id="category-list" class="category-list"></div>
        </div>
        <div class="sidebar-foot">
            <button class="side-item" id="btn-settings-2">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                影视设置
            </button>
        </div>
    </aside>
    <div class="sidebar-mask" id="sidebar-mask"></div>

    <!-- 主内容 -->
    <main class="tv-main" id="tv-main"></main>
</div>

<!-- 移动端底部导航 -->
<nav class="bottom-nav">
    <a href="#/" class="bn-item active" data-nav="home">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>首页</span>
    </a>
    <a href="#/calendar" class="bn-item" data-nav="calendar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
        <span>日历</span>
    </a>
    <a href="#/favorites" class="bn-item" data-nav="favorites">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>收藏</span>
    </a>
    <a href="#/history" class="bn-item" data-nav="history">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>观看</span>
    </a>
</nav>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settings-modal" style="display:none">
    <div class="modal">
        <div class="modal-head">
            <h3>影视设置</h3>
            <button class="modal-close" id="settings-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>站点名称</label>
                <input type="text" id="set-site-name" placeholder="MoonTV">
            </div>
            <div class="form-group">
                <label>站点公告</label>
                <textarea id="set-announcement" rows="2" placeholder="站点公告"></textarea>
            </div>
            <div class="form-group">
                <label>接口缓存时间（秒）</label>
                <input type="number" id="set-cache-time" value="7200">
            </div>
            <div class="form-group">
                <label>配置文件（JSON）</label>
                <textarea id="set-config" rows="12" spellcheck="false" class="mono"></textarea>
                <p class="form-hint">支持标准苹果CMS V10 API 格式。api_site 中增删资源站。</p>
            </div>
            <div class="form-group">
                <label>订阅导入（base58）</label>
                <div class="row">
                    <input type="text" id="set-subscribe" placeholder="粘贴 MoonTV 订阅链接">
                    <button class="btn primary" id="btn-subscribe-import">导入</button>
                </div>
                <button class="btn ghost" id="btn-subscribe-copy" style="margin-top:8px">复制我的订阅链接</button>
                <p class="form-hint" id="subscribe-hint"></p>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn ghost" id="settings-cancel">取消</button>
            <button class="btn primary" id="settings-save">保存配置</button>
        </div>
    </div>
</div>

<!-- 公告条 -->
<div class="announcement" id="announcement" style="display:none">
    <div class="announcement-inner" id="announcement-text"></div>
    <button class="announcement-close" id="announcement-close">&times;</button>
</div>

<!-- 播放器容器（全屏弹层） -->
<div class="player-overlay" id="player-overlay" style="display:none">
    <div class="player-head">
        <button class="icon-btn" id="player-back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="player-title" id="player-title"></div>
        <div class="player-ep-info" id="player-ep-info"></div>
    </div>
    <div id="player-container"></div>
    <div class="player-episodes" id="player-episodes"></div>
</div>

<script src="/static/js/tv.js?v=7"></script>
</body>
</html>
