[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# 允许 eval/new Function（hls.js/ArtPlayer 依赖）
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; worker-src * blob:; media-src * blob:;"

# ===== OSINT API → Netlify Functions 重定向 =====
[[redirects]]
  from = "/api/ip-lookup"
  to = "/.netlify/functions/ip-lookup"
  status = 200

[[redirects]]
  from = "/api/phone-lookup"
  to = "/.netlify/functions/phone-lookup"
  status = 200

[[redirects]]
