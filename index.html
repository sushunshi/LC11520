<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>window.__NETLIFY__=true;</script>
    <title>GhostTrack OSINT — 开源情报工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Leaflet CSS from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"
          onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2" fill="none" opacity=".6"/>
                    <circle cx="16" cy="16" r="8" fill="currentColor" opacity=".12"/>
                    <circle cx="16" cy="16" r="4" fill="currentColor" opacity=".35"/>
                    <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="16" y1="26" x2="16" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h1>GhostTrack<span class="accent"> OSINT</span></h1>
                <span class="badge">v2</span>
            </div>
            <p class="subtitle">轻量级开源情报工具 — IP 定位 / 手机归属 / 社交足迹 / 资源嗅探</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="ip">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                IP 定位
            </button>
            <button class="tab" data-tab="phone">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                手机归属
            </button>
            <button class="tab" data-tab="username">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                用户名搜索
            </button>
            <button class="tab" data-tab="resource">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                资源嗅探
            </button>
            <a href="/tv" class="tab tv-entry" style="text-decoration:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><polyline points="17 2 12 7 7 2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                影视聚合
            </a>
        </nav>

        <main class="panels">
            <section class="panel active" id="panel-ip">
                <div class="search-box">
                    <input type="text" id="ip-input" placeholder="输入 IP 地址，例如 8.8.8.8" autocomplete="off">
                    <button id="ip-search-btn" class="btn-primary">查询</button>
                </div>
                <div id="ip-result" class="result-area"></div>
            </section>
            <section class="panel" id="panel-phone">
                <div class="search-box">
                    <input type="text" id="phone-input" placeholder="输入手机号，例如 +86 13800138000" autocomplete="off">
                    <button id="phone-search-btn" class="btn-primary">分析</button>
                </div>
                <div id="phone-result" class="result-area"></div>
            </section>
            <section class="panel" id="panel-username">
                <div class="search-box">
                    <input type="text" id="username-input" placeholder="输入用户名，例如 torvalds" autocomplete="off">
                    <button id="username-search-btn" class="btn-primary">搜索</button>
                </div>
                <div id="username-result" class="result-area"></div>
            </section>
            <section class="panel" id="panel-resource">
                <div class="res-tabs">
                    <button class="res-tab active" data-restab="sniff">页面嗅探</button>
                    <button class="res-tab" data-restab="resolve">解析下载</button>
                    <button class="res-tab" data-restab="m3u8">M3U8 解析</button>
                </div>
                <div class="res-panel active" id="res-sniff">
                    <div class="search-box">
                        <input type="text" id="sniff-url" placeholder="粘贴链接，支持微信视频号/抖音/快手/小红书/B站等" autocomplete="off">
                        <button id="sniff-btn" class="btn-primary">分析</button>
                    </div>
                    <div id="sniff-result" class="result-area"></div>
                </div>
                <div class="res-panel" id="res-resolve">
                    <div class="search-box">
                        <input type="text" id="resolve-url" placeholder="粘贴抖音/B站/YouTube 链接或分享文本，自动解析视频下载地址" autocomplete="off">
                        <button id="resolve-btn" class="btn-primary">解析</button>
                    </div>
                    <div id="resolve-result" class="result-area"></div>
                </div>
                <div class="res-panel" id="res-m3u8">
                    <div class="search-box">
                        <input type="text" id="m3u8-url" placeholder="粘贴 .m3u8 播放列表地址" autocomplete="off">
                        <button id="m3u8-btn" class="btn-primary">解析</button>
                    </div>
                    <div id="m3u8-result" class="result-area"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>GhostTrack OSINT — 仅用于合法的安全研究、渗透测试授权范围及个人隐私自查。</p>
        </footer>
    </div>

    <!-- Leaflet JS with CDN fallback -->
    <script>
    window._leafletReady = false;
    function loadLeaflet(url, fallback) {
        var s = document.createElement('script');
        s.src = url;
        s.onload = function() { window._leafletReady = true; };
        s.onerror = function() {
            if (fallback) loadLeaflet(fallback, null);
            else console.warn('Leaflet failed to load from all CDNs');
        };
        document.head.appendChild(s);
    }
    loadLeaflet(
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js',
        'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
    );
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
